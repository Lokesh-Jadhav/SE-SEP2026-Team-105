          type: integer
          description: Database identifier of the user.
          example: 2
        email:
          type: string
          format: email
          example: ahmed@student.com
        role:
          type: string
          enum:
            - student
            - mentor
            - admin
          example: student
        profile_completed:
          type: boolean
          description: True after a student or mentor profile has been saved.
          example: true
          
    StudentProfileRequest:
      type: object
      required:
        - full_name
        - goal
      properties:
        full_name:
          type: string
          maxLength: 150
